name: Build CV

on:
  push:
    paths:
      - 'cv.tex'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex

      - name: Rename output
        run: mv cv.pdf kazemi_cv.pdf

      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kazemi_cv.pdf
          git diff --cached --quiet || git commit -m "Auto-build CV PDF"
          git push
